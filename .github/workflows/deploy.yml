name: Deploy

on:
  push:
    branches: [main]
  # So a deploy can be re-run without an empty commit.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. Unlike CI, an in-flight deploy is not cancelled: half a
# deployment is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # The same gate CI runs. Deliberately repeated here rather than trusting
      # the CI run on this commit: this job is what publishes, so it should be
      # the thing that refuses to publish something broken.
      - run: npm run check

      - run: npm run build

      - uses: actions/configure-pages@v6

      # No .nojekyll needed: the Actions deployment serves the artifact
      # directly and never runs Jekyll over it.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
